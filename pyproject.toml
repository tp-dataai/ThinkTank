[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tianpeng", email = "tianpengdataai@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.12.0",
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "grandalf>=0.8",
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "minio>=7.2.20",
    "numpy>=2.5.4",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "modelscope>=1.40.2",
    "pymilvus[model]>=3.0.2",
    "openai-agents>=0.24.0",
    "dashscope>=2.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
