<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h2>sse01</h2>
    <button id="btn">点我发请求</button>
    <div id="content">

    </div>



    <script>
        const btn = document.getElementById("btn")
        btn.onclick = async function (){
            //todo 第一大步：点击按钮，发送一个普通的http请求,目的是为了让后端开始造数据
            const res = await fetch("http://localhost:8000/startwork/123456")
            const data = await res.json()
            console.log(data)

            //todo 第三大步：发请求订阅sse 就是一个普通的请求和后端对应的接口
            const es = new EventSource("http://localhost:8000/sse01?session_id=123456")
            es.onmessage = function (e){
                // console.log(e.data)
                if(e.data === "None"){
                    es.close()
                }else{
                    const divNode = document.getElementById("content")
                    divNode.innerHTML += e.data + "<br>"
                    // divNode.innerHTML =  divNode.innerHTML +e.data
                }
            }

        }



    </script>
</body>
</html>
