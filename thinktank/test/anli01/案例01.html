<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h2>我是一个测试页面</h2>
    <!-- <img src="E:\rag_project\images\image.png" /> -->
    <button id="btn">按钮</button>
    <div id="content"></div>

    <script>
        btn = document.getElementById("btn")
        btn.onclick = async function () {
            // 第一步：发起下单请求
            // fetch：常规的 HTTP 请求，仅仅是为了告诉后端“我要开始了”。这个请求非常快就返回了。
            res = await fetch("http://localhost:8001/send_message?session_id=123456")
            data = await res.json();
            console.log(data)

            // 第二步：连接服务员（建立 SSE 连接）
            // EventSource：这是 HTML5 原生支持的 SSE 对象。它一旦建立连接，如果断开了，浏览器默认会自动重连。
            es = new EventSource("http://localhost:8001/ssestream?session_id=123456")

            // 第三步：监听服务员端过来的菜
            // es.onmessage：只要后端 yield 吐出一个数据，这个回调函数就会触发一次，完美实现“打字机”效果。
            es.onmessage = function (e){
                console.log(e.data)
                // 如果端过来的不是 "None"（后端传的 None 在 SSE 会变成字符串 "None"）
                if(e.data !== "None"){
                    document.getElementById("content").innerHTML += (e.data + '<br>');
                }else{
                    // 上菜结束，主动断开连接，防止无限重连
                    es.close()
                }
            }
        }
    </script>
</body>
</html>
